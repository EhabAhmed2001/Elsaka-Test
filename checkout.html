<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>إتمام الطلب | متجري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body class="checkout-page">

  <nav class="navbar site-navbar">
    <div class="container">

      <a class="brand" href="index.html">
        <span class="brand-mark">
          <i class="bi bi-flower1"></i>
        </span>

        <span>
          متجري
          <small>اختيارك للعناية اليومية</small>
        </span>
      </a>

      <a class="inline-link" href="index.html#packages">
        <i class="bi bi-arrow-right"></i>
        العودة للمتجر
      </a>

    </div>
  </nav>

  <main class="container checkout-wrap">

    <div class="section-heading text-center">
      <span class="eyebrow">خطوة أخيرة</span>

      <h2>
        إتمام <span>الطلب</span>
      </h2>

      <p>راجع طلبك وأدخل بيانات التوصيل.</p>
    </div>

    <div class="checkout-layout">

      <!-- ملخص الطلب -->
      <div class="checkout-summary-column">

        <section class="checkout-panel">

          <h3>
            <i class="bi bi-bag-check"></i>
            ملخص الطلب
          </h3>

          <div id="checkoutSummary"></div>

          <div class="cart-total-row checkout-cost-row">
            <span>إجمالي المنتجات</span>
            <strong id="checkoutSubtotal">0 ج.م</strong>
          </div>

          <div class="cart-total-row checkout-cost-row">
            <span>مصاريف الشحن</span>
            <strong id="checkoutShipping">اختار المحافظة</strong>
          </div>

          <div class="cart-total-row checkout-total">
            <span>الإجمالي النهائي</span>
            <strong id="checkoutTotal">0 ج.م</strong>
          </div>

        </section>

      </div>

      <!-- بيانات التوصيل -->
      <div class="checkout-form-column">

        <section class="checkout-panel">

          <h3>
            <i class="bi bi-person-lines-fill"></i>
            بيانات التوصيل
          </h3>

          <form id="checkoutForm" class="checkout-form">

            <!-- الاسم -->
            <div class="row g-3 mb-3">

              <div class="col-md-6">
                <label class="form-label" for="customerFirstName">
                  الاسم الأول
                </label>

                <input class="form-control" id="customerFirstName" name="firstName" type="text" required
                  autocomplete="given-name" placeholder="اكتب الاسم الأول">
              </div>

              <div class="col-md-6">
                <label class="form-label" for="customerLastName">
                  الاسم الثاني
                </label>

                <input class="form-control" id="customerLastName" name="lastName" type="text" required
                  autocomplete="family-name" placeholder="اكتب الاسم الثاني">
              </div>

              <input type="hidden" id="customerFullName" name="name">

            </div>

            <!-- رقم الهاتف -->
            <div class="mb-3">

              <label class="form-label" for="customerPhone">
                رقم الهاتف
              </label>

              <input class="form-control" id="customerPhone" name="phone" type="tel" required inputmode="tel"
                autocomplete="tel" pattern="[0-9+()\-\s]{8,20}" placeholder="01xxxxxxxxx">

            </div>

            <!-- المحافظة -->
            <div class="mb-3">

              <label class="form-label" for="customerGovernorate">
                المحافظة
              </label>

              <select class="form-select" id="customerGovernorate" name="governorate" required
                autocomplete="address-level1" disabled>

                <option value="">
                  جاري تحميل المحافظات...
                </option>

              </select>

              <small class="shipping-note" id="shippingMessage">
                اختاري المحافظة لحساب مصاريف الشحن.
              </small>

              <input type="hidden" id="shippingCostInput" name="shippingCost">

            </div>

            <!-- العنوان -->
            <div class="mb-3">

              <label class="form-label" for="customerAddress">
                العنوان بالتفصيل
              </label>

              <textarea class="form-control" id="customerAddress" name="address" rows="3" required
                autocomplete="street-address" placeholder="الشارع، رقم العقار، الدور، علامة مميزة"></textarea>

            </div>

            <!-- الملاحظات -->
            <div class="mb-3">

              <label class="form-label" for="customerNotes">
                ملاحظات إضافية (اختياري)
              </label>

              <textarea class="form-control" id="customerNotes" name="notes" rows="2"
                placeholder="أي تفاصيل تساعد في التوصيل"></textarea>

            </div>

            <!-- الدفع -->
            <div class="cod-option">

              <i class="bi bi-cash-coin"></i>

              <div>
                <strong>الدفع عند الاستلام</strong>
                <small>ستدفع قيمة الطلب نقدًا عند وصوله.</small>
              </div>

              <i class="bi bi-check-circle-fill"></i>

            </div>

            <button class="btn btn-main w-100 mt-3" type="submit">

              تأكيد البيانات
              <i class="bi bi-arrow-left"></i>

            </button>

            <!-- <p class="checkout-disclaimer" id="checkoutNotice">
              هذه واجهة تجريبية؛ لن يتم إرسال الطلب أو حفظ بياناتك.
            </p> -->

          </form>

        </section>

      </div>

    </div>

  </main>

  <script src="checkout.js"></script>

</body>

</html>
