<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تفاصيل المنتج والصور والباقات المتاحة.">
  <title>تفاصيل المنتج | متجري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="checkout-page">


  <nav class="navbar navbar-expand-lg site-navbar sticky-top">
    <div class="container">

      <!-- Brand / Logo -->
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img src="assets/product-3.svg" alt="Logo">
        </span>
      </a>

      <!-- Mobile Toggle Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Navbar Content -->
      <div class="collapse navbar-collapse" id="mainNav">

        <!-- Navigation Links -->
        <ul class="navbar-nav mx-auto mb-3 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="index.html#home">الرئيسية</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#about">عن المنتج</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#ingredients">المكونات</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#usage">طريقة الاستخدام</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#reviews">آراء العملاء</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#packages">الباقات</a>
          </li>

        </ul>

        <!-- Navbar Actions -->
        <div class="nav-actions d-flex align-items-center gap-2">

          <button class="cart-nav-btn" id="cartToggle" type="button" aria-label="فتح سلة المشتريات"
            aria-controls="cartDrawer" aria-expanded="false">

            <i class="bi bi-bag"></i>
            <span>السلة</span>
            <b id="cartBadge" class="cart-badge" aria-live="polite">0</b>

          </button>

          <a class="inline-link" href="index.html#packages">
            <i class="bi bi-arrow-right"></i>
            العودة للمتجر
          </a>

        </div>
      </div>
    </div>
  </nav>


  <main class="container product-details-wrap">
    <div class="section-heading text-center">
      <h2>تفاصيل <span>العرض</span></h2>
    </div>

    <section class="product-details-panel">
      <div class="row g-4 g-lg-5 align-items-center">
        <div class="col-lg-6">
          <div class="product-gallery" aria-label="صور المنتج">
            <img id="galleryImage" src="assets/product-1.svg" alt="صورة توضيحية للمنتج">
            <button class="gallery-arrow gallery-prev" id="galleryPrev" type="button" aria-label="الصورة السابقة">
              <i class="bi bi-chevron-right"></i>
            </button>
            <button class="gallery-arrow gallery-next" id="galleryNext" type="button" aria-label="الصورة التالية">
              <i class="bi bi-chevron-left"></i>
            </button>
          </div>
          <div class="gallery-dots" id="galleryDots" aria-label="اختيار صورة"></div>
        </div>
        <div class="col-lg-6">
          <div class="product-details-copy">
            <span class="eyebrow">
              <i class="bi bi-patch-check"></i> 
              معلومات المنتج
            </span>

            <!-- product name -->
            <h1 id="productName">اسم المنتج</h1>
            <!-- product description -->
            <p class="product-description" id="productDescription">
              أضف هنا الوصف التفصيلي الفعلي للمنتج، ومميزاته وطريقة  استخدامه المعتمدة.
            </p>

            <div class="product-facts">
              <div class="product-fact">
                <small>الوزن / الحجم</small>
                <strong id="productWeight">
                  <!-- Product weight -->
                 3 KG
                </strong>
              </div>
              
              <!-- <div class="product-fact">
                <small>الباقة المختارة</small>
                <strong id="selectedPackage">الباقة التجريبية</strong>
              </div> -->

            </div>

            <!-- product price -->
            <div class="product-detail-price" id="productPrice">350 ج.م</div>

            <div class="d-grid d-sm-flex gap-2">
              <a class="btn btn-main flex-fill" id="detailsOrder" href="checkout.html?package=trial-15">
                اطلب الآن 
                <i class="bi bi-arrow-left"></i>
              </a>
              <a class="btn btn-outline-main flex-fill" href="index.html#packages">
                عرض كل العبوات
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
  <script src="product-details.js" defer></script>
</body>

</html>
